<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>AbsensiKu</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b30;--line:#273451;--text:#eef3ff;--muted:#a3afca;--accent:#7c9cff;--green:#58d6a2;--red:#ff7f91}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#172448,var(--bg) 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:980px;margin:auto;padding:22px 15px 50px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{background:linear-gradient(135deg,#7c9cff,#8f7cff);width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px}
.brand h1{font-size:24px;margin:0}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.panel{background:rgba(19,27,48,.95);border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0;box-shadow:0 10px 30px #0002}
h2{font-size:17px;margin:0 0 13px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
input,select,textarea,button{font:inherit;border-radius:11px;border:1px solid var(--line);padding:11px 12px;background:#0d1427;color:var(--text);width:100%;min-width:0}
textarea{resize:vertical;min-height:65px}
button{cursor:pointer;background:#26385f;font-weight:650;border-color:#3a5186}
button.primary{background:var(--accent);color:#0b1020;border-color:transparent}
button.danger{background:#4a2333;border-color:#78384b}
button:disabled{opacity:.55;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:flex;gap:9px;align-items:center}
.row>*{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{width:auto;flex:1;padding:10px}
.tabs button.active{background:var(--accent);color:#10182b}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.stat{padding:13px;border-radius:13px;background:#0d1427;border:1px solid var(--line)}
.stat small{display:block;color:var(--muted)}
.stat strong{font-size:24px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.status{font-size:13px;color:var(--muted);margin:9px 0;overflow-wrap:anywhere}
.status.ok{color:var(--green)}
.status.err{color:var(--red)}
.list{display:grid;gap:8px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.item .info{min-width:0}
.item strong{display:block;overflow-wrap:anywhere}
.item small{color:var(--muted)}
.item button{width:auto;padding:8px 10px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:20px}
@media(max-width:600px){
 main{padding:16px 11px 35px}
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .brand h1{font-size:22px}
 .panel{padding:14px}
}
</style>
</head>
<body>
<main>
<header class="brand">
<div class="logo">✓</div>
<div><h1>AbsensiKu</h1><p>Absensi siswa, tersimpan di Supabase</p></div>
</header>

<section class="panel" id="authPanel">
<h2>Masuk admin</h2>
<p class="muted" style="font-size:13px">Masuk dengan akun yang sudah terdaftar.</p>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="admin@email.com">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
<div class="grid" style="margin-top:12px">
<button class="primary" id="loginBtn">Masuk</button>
<button id="signupBtn">Buat akun</button>
</div>
<div id="authMsg" class="status"></div>
</section>

<div id="app" class="hidden">
<div class="panel">
<div class="row">
<div><strong id="userLabel">Admin</strong><div class="status">Database online · data dipisahkan per akun</div></div>
<button id="logoutBtn" style="max-width:110px">Keluar</button>
</div>
</div>

<nav class="panel tabs">
<button class="active" data-tab="home">Ringkasan</button>
<button data-tab="students">Data siswa</button>
<button data-tab="attendance">Absensi</button>
<button data-tab="report">Rekap</button>
</nav>

<section class="panel tab" id="tab-home">
<h2>Ringkasan hari ini</h2>
<div class="stats">
<div class="stat"><small>Total siswa</small><strong id="totalStudents">0</strong></div>
<div class="stat"><small>Hadir</small><strong id="totalHadir">0</strong></div>
<div class="stat"><small>Izin</small><strong id="totalIzin">0</strong></div>
<div class="stat"><small>Sakit / Alpa</small><strong id="totalOther">0</strong></div>
</div>
<p class="status" id="homeDate"></p>
</section>

<section class="panel tab hidden" id="tab-students">
<h2>Tambah siswa</h2>
<div class="grid">
<div><label for="nis">NIS</label><input id="nis" placeholder="Nomor induk siswa"></div>
<div><label for="name">Nama lengkap</label><input id="name" placeholder="Nama siswa"></div>
<div><label for="className">Kelas</label><input id="className" placeholder="Contoh: XI TKJ 1"></div>
<div><label for="gender">Jenis kelamin</label><select id="gender"><option value="">Tidak diisi</option><option>Laki-laki</option><option>Perempuan</option></select></div>
</div>
<button class="primary" id="addStudent" style="margin-top:12px">Simpan siswa</button>
<div id="studentMsg" class="status"></div>
<label for="searchStudent">Cari siswa</label>
<input id="searchStudent" placeholder="Cari nama atau NIS">
<div id="studentList" class="list" style="margin-top:12px"></div>
</section>

<section class="panel tab hidden" id="tab-attendance">
<h2>Catat kehadiran</h2>
<div class="grid">
<div><label for="attDate">Tanggal</label><input id="attDate" type="date"></div>
<div><label for="classFilter">Filter kelas</label><input id="classFilter" placeholder="Kosongkan untuk semua kelas"></div>
</div>
<div id="attendanceList" class="list" style="margin-top:12px"></div>
<div id="attendanceMsg" class="status"></div>
</section>

<section class="panel tab hidden" id="tab-report">
<h2>Rekap kehadiran</h2>
<div class="grid">
<div><label for="fromDate">Dari tanggal</label><input id="fromDate" type="date"></div>
<div><label for="toDate">Sampai tanggal</label><input id="toDate" type="date"></div>
</div>
<button class="primary" id="loadReport" style="margin-top:12px">Tampilkan rekap</button>
<button id="exportCsv" style="margin-top:8px">Ekspor CSV</button>
<div id="reportList" class="list" style="margin-top:12px"></div>
<div id="reportMsg" class="status"></div>
</section>
<div id="globalMsg" class="status"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://wegpfdgtairwjvvdikaq.supabase.co";
const SUPABASE_KEY = "sb_publishable_To4902KKLrUEBUf9i4Y-EQ_AtZit5_o";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let students = [];
let attendance = [];
let reportRows = [];
let currentUser = null;
let loading = false;

function localDate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const today = localDate();
$('attDate').value = today;
$('fromDate').value = today;
$('toDate').value = today;
$('homeDate').textContent = 'Tanggal: ' + today;

function msg(id, text, kind = '') {
  const el = $(id);
  el.textContent = text;
  el.className = 'status ' + kind;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showApp(user) {
  currentUser = user || null;
  $('authPanel').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);

  if (user) {
    $('userLabel').textContent = user.email || 'Admin';
    refreshAll();
  } else {
    students = [];
    attendance = [];
    reportRows = [];
    $('studentList').innerHTML = '';
    $('attendanceList').innerHTML = '';
    $('reportList').innerHTML = '';
    msg('globalMsg', '');
  }
}

async function auth(action) {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || password.length < 6) {
    msg('authMsg', 'Isi email dan password minimal 6 karakter.', 'err');
    return;
  }

  const btn = $(action === 'login' ? 'loginBtn' : 'signupBtn');
  btn.disabled = true;
  msg('authMsg', 'Memproses...');

  try {
    const result = action === 'login'
      ? await db.auth.signInWithPassword({email, password})
      : await db.auth.signUp({email, password});

    if (result.error) throw result.error;

    if (action === 'signup' && !result.data.session) {
      msg('authMsg', 'Akun dibuat. Verifikasi email jika diminta, lalu masuk.', 'ok');
    } else {
      msg('authMsg', 'Berhasil.', 'ok');
      showApp(result.data.user);
    }
  } catch (e) {
    msg('authMsg', e.message || 'Gagal autentikasi.', 'err');
  } finally {
    btn.disabled = false;
  }
}

$('loginBtn').onclick = () => auth('login');
$('signupBtn').onclick = () => auth('signup');

$('logoutBtn').onclick = async () => {
  const {error} = await db.auth.signOut();
  if (error) msg('globalMsg', error.message, 'err');
  showApp(null);
};

db.auth.onAuthStateChange((_event, session) => {
  const user = session?.user || null;
  if ((currentUser?.id || null) !== (user?.id || null)) {
    showApp(user);
  }
});

document.querySelectorAll('[data-tab]').forEach(button => {
  button.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach(item =>
      item.classList.toggle('active', item === button)
    );

    document.querySelectorAll('.tab').forEach(item =>
      item.classList.toggle('hidden', item.id !== 'tab-' + button.dataset.tab)
    );

    if (button.dataset.tab === 'attendance') loadAttendance();
    if (button.dataset.tab === 'report') loadReport();
  };
});

async function refreshAll() {
  if (!currentUser || loading) return;
  loading = true;
  try {
    await loadStudents();
    await loadAttendance();
  } finally {
    loading = false;
  }
}

async function loadStudents() {
  const {data, error} = await db
    .from('app_students')
    .select('*')
    .order('name');

  if (error) {
    msg('globalMsg', 'Database: ' + error.message, 'err');
    return;
  }

  students = data || [];
  renderStudents();
  renderAttendance();
  updateStats();
}

function renderStudents() {
  const query = $('searchStudent').value.toLowerCase();
  const list = students.filter(s =>
    (s.name + ' ' + s.nis + ' ' + (s.class_name || ''))
      .toLowerCase().includes(query)
  );

  $('studentList').innerHTML = list.map(s => `
    <div class="item">
      <div class="info">
        <strong>${esc(s.name)}</strong>
        <small>NIS ${esc(s.nis)} · ${esc(s.class_name || '-')} · ${esc(s.gender || '-')}</small>
      </div>
      <button class="danger" data-delete="${s.id}">Hapus</button>
    </div>
  `).join('') || '<p class="muted">Belum ada siswa.</p>';

  document.querySelectorAll('[data-delete]').forEach(button => {
    button.onclick = () => deleteStudent(button.dataset.delete);
  });
}

$('searchStudent').oninput = renderStudents;

$('addStudent').onclick = async () => {
  const nis = $('nis').value.trim();
  const name = $('name').value.trim();

  if (!nis || !name) {
    msg('studentMsg', 'NIS dan nama wajib diisi.', 'err');
    return;
  }

  const {data: {user}, error: authError} = await db.auth.getUser();
  if (authError || !user) {
    msg('studentMsg', 'Sesi login tidak ditemukan. Login ulang.', 'err');
    return;
  }

  const {error} = await db.from('app_students').insert({
    nis,
    name,
    class_name: $('className').value.trim() || null,
    gender: $('gender').value || null,
    user_id: user.id
  });

  if (error) {
    msg('studentMsg', error.message, 'err');
    return;
  }

  $('nis').value = '';
  $('name').value = '';
  $('className').value = '';
  $('gender').value = '';

  msg('studentMsg', 'Siswa tersimpan di database.', 'ok');
  await loadStudents();
};

async function deleteStudent(id) {
  if (!confirm('Hapus data siswa ini beserta absensinya?')) return;

  const {error} = await db.from('app_students')
    .delete()
    .eq('id', id);

  if (error) {
    msg('studentMsg', error.message, 'err');
    return;
  }

  await loadStudents();
  await loadAttendance();
}

$('attDate').onchange = loadAttendance;
$('classFilter').oninput = renderAttendance;

async function loadAttendance() {
  if (!currentUser) return;

  const date = $('attDate').value || today;
  const {data, error} = await db.from('app_attendance')
    .select('*')
    .eq('user_id', currentUser.id)
    .eq('attendance_date', date);

  if (error) {
    msg('attendanceMsg', error.message, 'err');
    return;
  }

  attendance = data || [];
  renderAttendance();
  updateStats();
}

function renderAttendance() {
  const filter = $('classFilter').value.toLowerCase();
  const list = students.filter(s =>
    (s.class_name || '').toLowerCase().includes(filter)
  );

  $('attendanceList').innerHTML = list.map(s => {
    const record = attendance.find(a => a.student_id === s.id);

    return `
      <div class="item">
        <div class="info">
          <strong>${esc(s.name)}</strong>
          <small>${esc(s.nis)} · ${esc(s.class_name || '-')}</small>
        </div>
        <div style="width:125px;flex:none">
          <select data-att="${s.id}">
            <option value="">Belum diisi</option>
            ${['Hadir','Izin','Sakit','Alpa'].map(status =>
              `<option value="${status}" ${record?.status === status ? 'selected' : ''}>${status}</option>`
            ).join('')}
          </select>
        </div>
      </div>
    `;
  }).join('') || '<p class="muted">Tambahkan data siswa dulu.</p>';

  document.querySelectorAll('[data-att]').forEach(select => {
    select.onchange = () => saveAttendance(select.dataset.att, select.value);
  });
}

async function saveAttendance(id, status) {
  const date = $('attDate').value || today;

  const {data: {user}, error: authError} = await db.auth.getUser();

  if (authError || !user) {
    msg('attendanceMsg', 'Sesi login tidak ditemukan. Login ulang.', 'err');
    return;
  }

  if (!status) {
    const {error} = await db.from('app_attendance')
      .delete()
      .eq('user_id', user.id)
      .eq('student_id', id)
      .eq('attendance_date', date);

    if (error) {
      msg('attendanceMsg', error.message, 'err');
    } else {
      msg('attendanceMsg', 'Catatan absensi dihapus.', 'ok');
      await loadAttendance();
    }
    return;
  }

  const student = students.find(s => s.id === id);

  if (!student) {
    msg('attendanceMsg', 'Data siswa tidak ditemukan.', 'err');
    return;
  }

  const payload = {
    user_id: user.id,
    student_id: student.id,
    student_nis: student.nis,
    student_name: student.name,
    class_name: student.class_name,
    attendance_date: date,
    status
  };

  const {error} = await db.from('app_attendance')
    .upsert(payload, {
      onConflict: 'user_id,student_id,attendance_date'
    });

  if (error) {
    msg('attendanceMsg', error.message, 'err');
    return;
  }

  msg('attendanceMsg', 'Absensi tersimpan.', 'ok');
  await loadAttendance();
}

function updateStats() {
  const counts = {Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0};

  attendance.forEach(record => {
    counts[record.status] = (counts[record.status] || 0) + 1;
  });

  $('totalStudents').textContent = students.length;
  $('totalHadir').textContent = counts.Hadir;
  $('totalIzin').textContent = counts.Izin;
  $('totalOther').textContent = counts.Sakit + counts.Alpa;
}

$('loadReport').onclick = loadReport;

async function loadReport() {
  if (!currentUser) return;

  const from = $('fromDate').value;
  const to = $('toDate').value;

  if (!from || !to || from > to) {
    msg('reportMsg', 'Rentang tanggal tidak valid.', 'err');
    return;
  }

  const {data, error} = await db.from('app_attendance')
    .select('*')
    .eq('user_id', currentUser.id)
    .gte('attendance_date', from)
    .lte('attendance_date', to)
    .order('attendance_date', {ascending: false})
    .order('student_name');

  if (error) {
    msg('reportMsg', error.message, 'err');
    return;
  }

  reportRows = data || [];

  $('reportList').innerHTML = reportRows.map(record => `
    <div class="item">
      <div class="info">
        <strong>${esc(record.student_name)}</strong>
        <small>${esc(record.student_nis)} · ${esc(record.class_name || '-')} · ${esc(record.attendance_date)}</small>
      </div>
      <span class="tag">${esc(record.status)}</span>
    </div>
  `).join('') || '<p class="muted">Belum ada data pada rentang ini.</p>';

  msg('reportMsg', `${reportRows.length} catatan ditemukan.`, 'ok');
}

$('exportCsv').onclick = () => {
  if (!reportRows.length) {
    msg('reportMsg', 'Tampilkan rekap dulu sebelum ekspor.', 'err');
    return;
  }

  const fields = [
    'attendance_date',
    'student_nis',
    'student_name',
    'class_name',
    'status'
  ];

  const csv = [
    fields.join(','),
    ...reportRows.map(record =>
      fields.map(field =>
        '"' + String(record[field] ?? '').replace(/"/g, '""') + '"'
      ).join(',')
    )
  ].join('\r\n');

  const url = URL.createObjectURL(
    new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'})
  );

  const link = document.createElement('a');
  link.href = url;
  link.download = 'rekap-absensi.csv';
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

(async function init() {
  const {data: {session}, error} = await db.auth.getSession();

  if (error) {
    msg('authMsg', error.message, 'err');
    return;
  }

  if (session?.user) showApp(session.user);
})();
</script>
</body>
</html>
